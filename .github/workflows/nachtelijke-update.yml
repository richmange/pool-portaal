name: Nachtelijke update

on:
  schedule:
    # Bewust op "rare" minuten: GitHub schuift of schrapt runs op :00/:30 vaak bij drukte.
    # Tijden zijn UTC. Winter (CET) = +1 uur, zomer (CEST) = +2 uur.
    - cron: "7 1 * * *"    # ~02:07 NL (winter)
    - cron: "7 7 * * *"    # ~08:07 NL (winter)
  workflow_dispatch:        # handmatig starten kan ook
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache afgeronde wedstrijden
        uses: actions/cache@v4
        with:
          path: data/raw/seasons
          key: raw-${{ github.run_id }}
          restore-keys: raw-
      - name: Data ophalen van CueScore
        run: python scraper/fetch.py
      - name: Statistieken en voorspellingen berekenen
        run: python scraper/build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
