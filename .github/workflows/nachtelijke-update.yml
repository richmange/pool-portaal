name: Nachtelijke update

on:
  schedule:
    - cron: "30 2 * * *"   # elke nacht ~04:30 Nederlandse tijd
  workflow_dispatch:        # handmatig starten kan ook
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache afgeronde wedstrijden
        uses: actions/cache@v4
        with:
          path: data/raw/seasons
          key: raw-${{ github.run_id }}
          restore-keys: raw-
      - name: Data ophalen van CueScore
        run: python scraper/fetch.py
      - name: Statistieken en voorspellingen berekenen
        run: python scraper/build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
